[package]
name = "splat-agent"
version = "0.2.0"
edition = "2021"
authors = ["Platten Industries"]
description = "SPLAT Layer-2 Resident eBPF Daemon & Kernel Containment Substrate"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
libc = "0.2"
libbpf-rs = "0.24"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
libbpf-cargo = "0.24"