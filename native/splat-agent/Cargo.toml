[package]
name = "splat-agent"
version = "0.2.0"
edition = "2021"
authors = ["Platten Industries"]
description = "SPLAT Layer-2 Resident eBPF Daemon & Kernel Containment Substrate"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hmac = "0.12"
libc = "0.2"
libbpf-rs = "0.24"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
libbpf-cargo = "0.24"

[features]
# Links libelf, zlib and zstd into the binary instead of beside it. The default dynamic link is right on
# the machine that built the daemon and wrong everywhere else: a guest without libelf installed cannot
# start it. packaging/publish-splat-mcp.ps1 builds with this feature for the copy splat-mcp.exe carries
# (roadmap 1.9), and the feature does not build on its own. That script also sets:
#
#   LIBBPF_SYS_LIBRARY_PATH    where libelf.a and libz.a live: libbpf-sys links them statically only
#                              from a directory it is told about.
#   RUSTFLAGS='-C link-arg=-l:libzstd.a'
#                              the distribution's libelf.a references zstd, which libbpf-sys never links.
#                              It must reach every link, not just the daemon's: libbpf-sys declares
#                              links = "bpf", so Cargo builds a single copy for host and target, and this
#                              crate's build script links that same static libelf. A build.rs line reaches
#                              only the daemon; --target neither splits the copies nor lets RUSTFLAGS
#                              reach the build script.
#
# glibc stays dynamic, so the oldest glibc the binary accepts is measured by that script, never assumed.
portable = ["libbpf-rs/static"]