[package]
name = "splat-canary"
version = "0.1.0"
edition = "2021"
description = "SPLAT kernel canary: proves BPF-LSM per-cgroup lease enforcement returns -EPERM."
license = "GPL-2.0-only"

# Pinned to the libbpf-rs 0.24 API. If you bump these, expect the skeleton/map/ringbuf
# call shapes in build.rs and src/main.rs to need small edits — the API is still moving.
[dependencies]
libbpf-rs = "0.24"
anyhow = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"

[build-dependencies]
libbpf-cargo = "0.24"

[[bin]]
name = "splat-canary"
path = "src/main.rs"

[profile.release]
opt-level = 2
